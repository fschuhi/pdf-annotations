repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: [ --quiet ]
        files: \.pyi?$
        # Black will read [tool.black] from pyproject.toml
        # If your project uses Python 3.8, Blackâ€™s default is fine.

  # Optional: Ruff for lint + import sort (fast). Uncomment to enable.
  # - repo: https://github.com/astral-sh/ruff-pre-commit
  #   rev: v0.6.9
  #   hooks:
  #     - id: ruff
  #       args: [--fix]
  #     - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
