[server]
# Port for the HTTP server to listen on
port = 8765
# Host to bind to (including Parallels)
host = 0.0.0.0

[windows]
# PDF base path - adjust to your Dropbox location
pdf_base_path = x:\work\Obsidian\_main\Papers\Collection\pdfs\
# PDF-XChange-Viewer executable path
viewer_path = C:\Program Files\Tracker Software\PDF Viewer\pdfxcview.exe

[logging]
# Enable detailed logging
verbose = true
