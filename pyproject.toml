[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf_annot"
version = "0.1.0"

# --- NEW: Add this section to create CLI commands ---
[project.scripts]
pdf-annot-extract = "pdf_annot.extract:main"
pdf-annot-streamline = "pdf_annot.streamline_annotations:main"
pdf-annot-sync = "pdf_annot.sync:main"
# --------------------------------------------------

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.black]
line-length = 120
target-version = ["py38"]
include = "\\.pyi?$"
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
